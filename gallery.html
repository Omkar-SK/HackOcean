<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABYSS – 3D Image Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="gallery-page">

  <!-- Canvas -->
  <canvas id="gallery-canvas"></canvas>

  <!-- Navigation -->
  <header class="mini-navbar" id="mainNav">
    <div class="mini-navbar-container">
      <div class="mini-navbar-logo">
        <div class="mini-logo">
          <span></span><span></span><span></span><span></span>
        </div>
        <a href="index.html" style="text-decoration: none;">
          <span class="logo-text">ABYSS</span>
        </a>
      </div>

      <nav class="mini-navbar-links">
        <a href="gallery.html" class="anim-link active">
          <div class="anim-link-inner">
            <span class="anim-link-default">Gallery</span>
            <span class="anim-link-hover">Gallery</span>
          </div>
        </a>
        <a href="index.html#about" class="anim-link">
          <div class="anim-link-inner">
            <span class="anim-link-default">About Us</span>
            <span class="anim-link-hover">About Us</span>
          </div>
        </a>
        <a href="contact.html" class="anim-link">
          <div class="anim-link-inner">
            <span class="anim-link-default">Contact Us</span>
            <span class="anim-link-hover">Contact Us</span>
          </div>
        </a>
      </nav>

      <div class="mini-navbar-actions">
        <div class="signup-button-wrapper">
          <div class="signup-button-glow"></div>
          <button class="signup-button" id="navBook">Join Expedition</button>
        </div>
      </div>

      <button class="mobile-menu-toggle" id="mobileMenuToggle" aria-label="Open Menu">
        <svg id="menuIconOpen" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
        <svg id="menuIconClose" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
      </button>
    </div>

    <!-- Mobile Menu -->
    <div class="mobile-menu" id="mobileMenu">
      <nav class="mobile-nav-links">
        <a href="gallery.html">Gallery</a>
        <a href="index.html#about">About Us</a>
        <a href="contact.html">Contact Us</a>
      </nav>
      <div class="mobile-nav-actions">
        <button class="signup-button" id="navBookMobile">Join Expedition</button>
      </div>
    </div>
  </header>

  <!-- Gallery Info Overlay -->
  <div class="gallery-info">
    <h1 class="gallery-title">Abyssal Artifacts</h1>
    <p class="gallery-sub">Drag to explore • Scroll to zoom • Click cards to view details</p>
  </div>

  <!-- Card Modal Overlay -->
  <div class="card-modal-overlay" id="cardModalOverlay">
    <div class="card-modal-content">
      <button class="card-modal-close" id="cardModalClose">
        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      </button>
      <div class="card-modal-tilt-wrapper" id="cardModalTilt">
        <div class="card-modal-inner">
          <div class="card-modal-image-wrapper">
            <img id="modalImage" src="" alt="Gallery Image" />
          </div>
          <h3 id="modalTitle" class="card-modal-title">Title</h3>
          <div class="card-modal-actions">
            <button class="card-btn download-btn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
              <span>Download</span>
            </button>
            <button class="card-btn heart-btn" id="heartBtn">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Shared Booking Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <button class="modal-close" id="modalClose">✕</button>
      <div class="modal-header">
        <h2 class="modal-title">Join The Expedition</h2>
        <p class="modal-sub">Secure your place on our next descent into the abyss.</p>
      </div>
      <form class="modal-form" id="bookingForm">
        <div class="form-row">
          <div class="form-group">
            <label>First Name</label>
            <input type="text" required placeholder="Jacques" />
          </div>
          <div class="form-group">
            <label>Last Name</label>
            <input type="text" required placeholder="Cousteau" />
          </div>
        </div>
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" required placeholder="explorer@ocean.org" />
        </div>
        <div class="form-row">
          <div class="form-group">
            <label>Expedition Location</label>
            <select required>
              <option value="" disabled selected>Select a destination</option>
              <option value="marianas">Marianas Trench (Pacific)</option>
              <option value="puerto-rico">Puerto Rico Trench (Atlantic)</option>
              <option value="java">Java Trench (Indian)</option>
            </select>
          </div>
          <div class="form-group">
            <label>Travel Dates</label>
            <input type="month" required />
          </div>
        </div>
        <div class="form-group">
          <label>Additional Requirements</label>
          <textarea rows="3" placeholder="Any special requests or certifications?"></textarea>
        </div>
        <button type="submit" class="submit-btn">Submit Request</button>
      </form>
    </div>
  </div>

  <!-- We load three.js directly from a CDN just for gallery.js if needed, or via Vite module -->
  <script type="module" src="/gallery.js"></script>
</body>
</html>
